# =========================================================
# Global
# =========================================================
namespace: erpnext


# =========================================================
# ERPNext Image
# =========================================================
image:
  repository: frappe/erpnext
  tag: v16.33.0
  pullPolicy: IfNotPresent


# =========================================================
# Frontend
# =========================================================
frontend:
  replicaCount: 2

  service:
    type: ClusterIP
    port: 8080

  resources:
    requests:
      cpu: 250m
      memory: 256Mi
    limits:
      cpu: 500m
      memory: 512Mi

  hpa:
    enabled: true
    minReplicas: 2
    maxReplicas: 5
    targetCPUUtilizationPercentage: 70


# =========================================================
# Backend
# =========================================================
backend:
  replicaCount: 2

  service:
    type: ClusterIP
    port: 8000

  resources:
    requests:
      cpu: 250m
      memory: 512Mi
    limits:
      cpu: 500m
      memory: 1Gi

  hpa:
    enabled: true
    minReplicas: 2
    maxReplicas: 5
    targetCPUUtilizationPercentage: 70


# =========================================================
# Redis Cache
# =========================================================
redisCache:
  image:
    repository: redis
    tag: 6.2-alpine

  replicaCount: 1

  service:
    type: ClusterIP
    port: 6379


# =========================================================
# Redis Queue
# =========================================================
redisQueue:
  image:
    repository: redis
    tag: 6.2-alpine

  replicaCount: 1

  service:
    type: ClusterIP
    port: 6379


# =========================================================
# Queue Short Worker
# =========================================================
queueShort:
  replicaCount: 1

  resources:
    requests:
      cpu: 250m
      memory: 512Mi
    limits:
      cpu: 500m
      memory: 1Gi

  hpa:
    enabled: true
    minReplicas: 1
    maxReplicas: 5
    targetCPUUtilizationPercentage: 70


# =========================================================
# Queue Long Worker
# =========================================================
queueLong:
  replicaCount: 1

  resources:
    requests:
      cpu: 250m
      memory: 512Mi
    limits:
      cpu: 500m
      memory: 1Gi

  hpa:
    enabled: true
    minReplicas: 1
    maxReplicas: 5
    targetCPUUtilizationPercentage: 70


# =========================================================
# Scheduler
# =========================================================
scheduler:
  replicaCount: 1

  resources:
    requests:
      cpu: 250m
      memory: 256Mi
    limits:
      cpu: 500m
      memory: 512Mi


# =========================================================
# WebSocket
# =========================================================
websocket:
  replicaCount: 2

  service:
    type: ClusterIP
    port: 9000

  resources:
    requests:
      cpu: 250m
      memory: 256Mi
    limits:
      cpu: 500m
      memory: 512Mi

  hpa:
    enabled: true
    minReplicas: 2
    maxReplicas: 5
    targetCPUUtilizationPercentage: 70


# =========================================================
# Ingress - AWS ALB
# =========================================================
ingress:
  enabled: true

  className: alb

  annotations:
    alb.ingress.kubernetes.io/scheme: internet-facing
    alb.ingress.kubernetes.io/target-type: ip
    alb.ingress.kubernetes.io/listen-ports: '[{"HTTP":80}]'
    alb.ingress.kubernetes.io/healthcheck-path: /api/method/ping
    alb.ingress.kubernetes.io/success-codes: "200"
    alb.ingress.kubernetes.io/healthcheck-port: "traffic-port"

  host: ""
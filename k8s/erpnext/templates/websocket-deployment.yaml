apiVersion: apps/v1
kind: Deployment
metadata:
  name: websocket
spec:
  replicas: 1

  selector:
    matchLabels:
      app: websocket

  template:
    metadata:
      labels:
        app: websocket

    spec:
      containers:
        - name: websocket
          image: shiva9828/frappe-websocket:v16.33.0

          command:
            - node
            - /home/frappe/frappe-bench/apps/frappe/socketio.js

          ports:
            - containerPort: 9000

          envFrom:
            - configMapRef:
                name: erpnext-config
            - secretRef:
                name: erpnext-secret
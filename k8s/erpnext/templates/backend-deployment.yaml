apiVersion: apps/v1
kind: Deployment
metadata:
  name: backend
spec:
  replicas: 2
  selector:
    matchLabels:
      app: backend

  template:
    metadata:
      labels:
        app: backend

    spec:
      containers:
        - name: backend
          image: shiva9828/frappe-backend:v16.33.0
          imagePullPolicy: IfNotPresent

          ports:
            - containerPort: 8000

          envFrom:
            - configMapRef:
                name: erpnext-config
            - secretRef:
                name: erpnext-secret

          volumeMounts:
            - name: sites
              mountPath: /home/frappe/frappe-bench/sites

          resources:
            requests:
              cpu: "250m"
              memory: "512Mi"
            limits:
              cpu: "500m"
              memory: "1Gi"

      volumes:
        - name: sites
          persistentVolumeClaim:
            claimName: sites-pvc
